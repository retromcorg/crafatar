name: Publish container

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is pushed back to GitHub, so the token stays read-only.
permissions:
  contents: read

env:
  # Nexus routes by path, so the repository name is part of the image
  # reference: repository.johnymuffin.com/docker-retromc/<image>.
  REGISTRY: repository.johnymuffin.com
  IMAGE_NAME: docker-retromc/crafatar

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Pull requests only check that the image builds; they never log in or push.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Checking the ref explicitly rather than using is_default_branch, so
          # this does not depend on GitHub's default-branch setting being right.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The builder stage runs the test suite, so a failing test fails the build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Nexus Docker repositories do not handle buildx attestation
          # manifests well; keep the push to a plain image manifest.
          provenance: false
          sbom: false
